schemaVersion: "2"
kind: sandbox
name: pix
displayName: Pix
description: "Multi-model pi coding agent on a Docker Hardened (DHI) Debian base"

sandbox:
  # Published image: consumers pull this by name (sbx auto-pulls it). For local
  # dev, `make load` builds + loads the image under this same name, so sbx uses
  # your local build instead of pulling. Change the namespace to match your
  # Docker Hub handle (must match Makefile DOCKER_USER).
  #
  # MUST be a pinned tag, never `:latest`: Docker re-pulls `:latest` on every
  # run even when the image is already loaded, defeating `make load`. A pinned
  # tag means "use the loaded build if present, else pull once." Keep in sync
  # with VERSION in the Makefile and `version` in package.json.
  image: "docker.io/mcavage/pix:0.1.69"
  entrypoint:
    # --session-dir persists sessions on the host-mounted workspace so they
    # survive sandbox recreation (`pix resume SESSION DIR`); --models sets
    # the Alt+P cycle squad (Ctrl+P is remapped to emacs cursor-up).
    [
        pi,
        "--session-dir",
        ".pi-sessions",
        "--models",
        "anthropic/claude-opus-5,anthropic/claude-sonnet-5,openai/gpt-5.6-sol,google/gemini-3.1-pro-preview,google/gemini-3.7-flash,ollama/*",
      ]

# Provider keys are read by the host proxy and swapped into the outbound auth
# header: the agent inside the VM only ever sees the "proxy-managed" sentinel
# (credentials[].apiKey.proxyManaged below). The real key never enters the VM:
# the proxy holds it, sourced from the sbx secret store, which pix seeds
# from 1Password (`pix setup`; op is required). See docs/CREDENTIALS.md.
#
# kit-spec v2. Each credential is a `service` (the sbx secret-store identifier)
# plus an apiKey block: apiKey.name is the in-VM env var (set to the sentinel),
# apiKey.inject[] tells the proxy which outbound domains to rewrite and with
# which header/format. Egress is separate: a domain the proxy injects into must
# ALSO be allowed for egress under permissions.network.allow, so the credential API
# hosts are listed there too. The per-credential `service:` is required: without
# it `sbx run` panics ("invalid identifier ... credentials/<sandbox>/").
permissions:
  network:
    allow:
      # Cloud model + GitHub API hosts the proxy injects credentials into (see
      # credentials[] below). Listed here because inject sets the auth header, but
      # egress is gated separately by this allowlist.
      - api.anthropic.com
      - console.anthropic.com
      - claude.ai
      - api.openai.com
      - api.github.com
      - uploads.github.com
      # Package registries + git fetch.
      - registry.npmjs.org
      - nodejs.org
      - github.com
      - codeload.github.com
      - objects.githubusercontent.com
      - raw.githubusercontent.com
      - pi.dev
      # pi-web-access web_search backends (else the call is blocked → hangs). Exa
      # is the zero-config default; the rest are its fallbacks. A backend with a
      # real key beats the keyless ones: wire one with `pix secret set
      # <VAR> op://...` + `pix secret sync`.
      - api.exa.ai
      - mcp.exa.ai
      - generativelanguage.googleapis.com
      - api.perplexity.ai
      # Parallel (parallel.ai) search + extract. Its key is proxy-injected as
      # x-api-key (see credentials[] below), so this host MUST be allowed here
      # too: injection and egress are separate gates.
      - api.parallel.ai
      # Host Ollama (:11434), the fourth inference provider. The in-sandbox
      # ollama-bridge extension forwards localhost:11434 here over node:http (pi's
      # fetch can't reach host.docker.internal through the sbx proxy; see the
      # extension). The memory loop's watcher + embeddings also run against host
      # Ollama. Optional; cloud models work without it.
      - host.docker.internal:11434
      - localhost:11434
      # Host memory service (the recall extension calls it over JSON-RPC). The store
      # and its embeddings live on the host; the sandbox only needs this URL. Host-
      # internal traffic bypasses the proxy MITM (see NO_PROXY in the Dockerfile);
      # recall is skipped if the service isn't running. Same pattern a pack's
      # own host-daemon integration uses to reach host services on host.docker.internal.
      - host.docker.internal:11435
      - localhost:11435
      # NOTE: :11437 used to be allowlisted here for the monitor ingest
      # listener. The whole monitor subsystem is gone, tap included: nothing
      # in the sandbox POSTs a transcript anywhere, or writes one to disk
      # under any other name, so the hole in the network policy went with it.
      # Nothing in the sandbox needs :11437.
      # A pack that needs a host service (e.g. a CLI exec-proxy) adds its own
      # domain to permissions.network.allow from its own synthesized mixin kit: the
      # public kit stays free of company-specific host services. See
      # docs/design/packs.md.
      # Note: local stdio MCP servers (e.g. google-workspace) are NOT here.
      # They're registered with sbx (`sbx mcp add … --command pix-host --args
      # <name>`), run by the MCP gateway and reached through it (not over
      # host.docker.internal), so they need no allowlist entry.

# Each provider key: `service` is the sbx secret-store identifier (pix seeds
# it from 1Password); apiKey.name is the in-VM env var, set to the proxy-managed
# sentinel; inject[] rewrites the auth header on the listed outbound domains.
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"
        - domain: console.anthropic.com
          header: x-api-key
          format: "%s"
        - domain: claude.ai
          header: x-api-key
          format: "%s"
  - service: openai
    apiKey:
      name: OPENAI_API_KEY
      proxyManaged: true
      inject:
        - domain: api.openai.com
          header: Authorization
          format: "Bearer %s"
  - service: google
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        # Gemini authenticates with the raw key in the x-goog-api-key header
        # (no Bearer prefix), unlike OpenAI's Authorization header.
        - domain: generativelanguage.googleapis.com
          header: x-goog-api-key
          format: "%s"
  # Parallel is a TOOL key, not a model provider: it buys pi-web-access's
  # search/extract backend, nothing routes to it, and its absence degrades web
  # search rather than blocking a launch. Same credential mechanics as the model
  # keys though: the real value stays on the host and only the sentinel enters
  # the VM. parallel.ts sends the key as a bare x-api-key header (no Bearer).
  - service: parallel
    apiKey:
      name: PARALLEL_API_KEY
      proxyManaged: true
      inject:
        - domain: api.parallel.ai
          header: x-api-key
          format: "%s"
  - service: github
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          header: Authorization
          format: "Bearer %s"
        - domain: uploads.github.com
          header: Authorization
          format: "Bearer %s"

environment:
  variables:
    # pi runs on Node, which uses its own bundled CA store (not the system one),
    # so it must be told to also trust the proxy's intercepting CA.
    NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/proxy-ca.crt

# The sandbox proxy terminates TLS and presents its own CA (delivered at runtime
# via $PROXY_CA_CERT_B64). The stock template images trust it out of the box; a
# custom image must install it. Same pattern as the docs' `internal-ca` kit.
setup:
  install:
    - command: 'mkdir -p /usr/local/share/ca-certificates && printf "%s" "$PROXY_CA_CERT_B64" | base64 -d > /usr/local/share/ca-certificates/proxy-ca.crt && update-ca-certificates'
      user: "0"
      description: Trust the sandbox proxy's TLS-intercepting CA
    # Register the sandbox MCP gateway with pi. pi isn't a native sbx agent
    # integration, so nothing auto-wires the gateway: the pi-mcp-adapter reads
    # ~/.pi/agent/mcp.json, so we write the gateway there (HTTP StreamableHTTP +
    # the sentinel bearer the egress proxy swaps for the real token). Without this
    # pi sees ZERO MCP: no MCP tools until configured servers are statically
    # preloaded (at sandbox create) or explicitly loaded (`pix mcp load`).
    # Guarded on MCP_GATEWAY_URL so a non-Docker host (no gateway) stays MCP-empty.
    # (Mirrors the claude/codex/gemini/kiro/opencode kits: see the sandboxes repo
    # docs/runbooks/mcp-gateway-registration.md.)
    - command: '[ -n "$MCP_GATEWAY_URL" ] || exit 0; mkdir -p "$HOME/.pi/agent"; printf ''{"settings":{"mcpFooterStatus":"problems"},"mcpServers":{"mcp-gateway":{"url":"%s","headers":{"Authorization":"Bearer %s"}}}}\n'' "$MCP_GATEWAY_URL" "$MCP_SENTINEL_TOKEN_NAME" > "$HOME/.pi/agent/mcp.json"'
      description: Register the sbx MCP gateway with pi (pi-mcp-adapter)

agentInstructions:
  filename: AGENTS.md
  content: |
    # pix
    You are pi, running inside the pix sandbox: a Docker Hardened (DHI) Debian
    base, isolated by Docker Sandboxes. The environment is disposable. Work
    directly and commit often.

    You run as a NON-root user (`node`) and there is NO `sudo` (the DHI base is
    minimal and ships none). You cannot install system packages (`apt-get` needs
    root), so do not try, and do not tell the user to `sudo`. Anything that needs a
    system-level install or a real device (e.g. platformio + `/dev/tty*`) is a HOST
    operation the sandbox structurally cannot do, with no escape hatch: pix has
    no `pix host` verb. Only a wired host-side capability MCP can reach it; else
    tell the user it must happen on their host. Use pip `--user`, language-local
    package managers, or static binaries in-VM.

    ## Memory (automatic recall, explicit capture)
    A host memory service silently recalls relevant facts before every turn;
    you never call it. Capture is explicit by default: stored only via
    /remember, unless the user opts into `experimental-auto` (quiet capture of
    durable facts/corrections, capped daily). Steer it with /recall, /remember,
    /forget. Empty recall means the user needs `make serve` (or `pix serve`)
    running on the host.

    ## Multi-model
    Four providers in the cycle: Claude, GPT, and Gemini (cloud, keys injected by the
    host proxy, never stored in this VM) plus Ollama (local, via the ollama-bridge
    extension). Switch with /model or --model. Use a stronger model (Opus, Gemini Pro)
    for synthesis and hard problems, and a cheap fast one (a small local Ollama model, a haiku/flash)
    for mechanical passes. For review, switch to a different vendor than wrote the code
    and re-read it (or fan out a `review` subagent: see below).

    ## Subagents
    Fan-out works, via our own extensions/subagents.ts (the off-the-shelf
    pi-subagents deadlocked on pi 0.80.x, so we replaced it). It registers a
    `subagent` tool with single / parallel / chain modes and depth-capped trees,
    each child spawned with an inactivity + wall-clock watchdog so a stuck one is
    killed and reported, never left hanging. Call it with {agent, task} (single),
    {tasks:[...]} (parallel), or {chain:[...]} with a {previous} placeholder:
    agent = a preset in ~/.pi/agent/agents:
      - fanout (haiku, read-only): spawn many for breadth.
      - deep (opus): one genuinely hard sub-problem.
      - review (cross-vendor): an adversarial second opinion before you ship.
      - specialists: architect, engineer, designer, product-manager, qa-lead,
        security-lead, sre-lead, devrel, dx-consultant, legal, finance-analyst,
        growth-marketing, ux-copywriter, enterprise-admin.
    Fan a task across the right roles, then synthesize. Use review before shipping.
    Run /subagents to list agents/config and /subagents doctor for a self-check.
    (Older skills say the Agent tool with subagent_type=…; that API is not present:
    use the subagent tool with agent=… instead. Explore/Plan are not installed.)

    ## Skills
    Tight, opinionated workflows you run by name: plan, build, ship, debug,
    code-review, tdd, verify, qa, brainstorm, challenge, design-review,
    healthcheck, and many more. They are forcing functions, not manuals.
    Auto-loaded when relevant.

    ## Output styles
    When Pix personal context is mounted, the `output_style` tool creates,
    activates, lists, or disables durable personal writing styles after a direct
    user request. `/output-style` lists or switches saved styles. A style controls
    prose form, never facts, task scope, tool permissions, verbatim technical
    content, or project rules.

    ## Installed harness
    plan mode (pi-plan), pi-mcp-adapter, todo list, pi-simplify, pi-web-access,
    usage HUD, and the baked status + subagents extensions.

    ## CLIs and MCP
    `gh` is installed; GitHub auth is routed through sbx credentials. Google
    Workspace runs host-side as the `gog` MCP server (spawned by the MCP gateway,
    authed with the host's own gog credentials, read-only by default). The VM
    never talks to Google directly. Run the host services with `make serve`.
    Use sbx Cloud MCP Gateway profiles for catalog servers (notion, atlassian,
    granola, …).

    ## Posture
    Full-auto: no permission prompts. The sandbox isolation is the safety boundary.
    Write in the user's voice (see the anti-slop and writing-voice skills): no
    em-dashes, no AI slop, direct and concrete.
