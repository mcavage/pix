# Gate the host Go binary on every push/PR: format, vet, and tests must pass.
# (The publish workflow only runs on version tags; this is the always-on check.)
name: test

on:
  push:
  pull_request:

jobs:
  go:
    name: go vet + test (services/host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: gofmt
        working-directory: services/host
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - name: vet
        working-directory: services/host
        run: go vet ./...
      - name: test
        working-directory: services/host
        run: go test -race ./...

  extensions:
    name: extension types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "25.9.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc --noEmit
      - run: node --test tests/*.test.mjs

  open-core:
    name: open-core boundary (no company/private-pack leak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: check allowlists + tracked tree
        run: bash scripts/check-open-core.sh
