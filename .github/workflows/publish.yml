name: publish

# Every push to main auto-publishes a NEW immutable version. CI starts with the
# version committed in package.json (0.1.0 for the first Pix release), then
# increments its patch component until it finds an unused v<version> git tag.
# It builds multi-arch (amd64 + arm64), pushes :<version> + :latest, then commits
# the selected version into all lockstep files ([skip ci] prevents recursion).
#
# Why: sbx caches materialized templates PER TAG NAME and won't re-pull a tag it
# already has. A moving tag (:edge/:latest) therefore goes stale until you evict
# it by hand. A brand-new version tag every push sidesteps that entirely. The
# committed spec.yaml always points at the latest successfully published image.
#
# Multi-arch native runners (no QEMU) — the image is chromium-heavy. Each arch is
# pushed by digest, then merged into one multi-arch tag.
#
# Required repo SECRETS (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  — one Docker Hub PAT (Read + Write) on a
#       DHI-entitled account. Authenticates BOTH the dhi.io base PULL and the
#       Docker Hub PUSH (DHI is gated by your Docker account, so one PAT does both).
# Optional repo VARIABLE:
#   DOCKER_USER                           — Docker Hub namespace (default: mcavage)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Serialize runs so version bumps land in order and the commit-back never races.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # the bump job commits the version bump back to main

env:
  IMAGE: docker.io/${{ vars.DOCKER_USER || 'mcavage' }}/pix

jobs:
  version:
    name: compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - id: v
        name: Select the next unused patch version
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          if ! [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "package.json version is not semver: $base" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version="$base"
          while git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; do
            patch=$((patch + 1))
            version="${major}.${minor}.${patch}"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Pix $version (base: $base)"

  # Real npm-resolution smoke for the two vendored runtime patches
  # (scripts/patches/*.mjs). tests/pi-patches.test.mjs (the PR gate) proves the
  # patch logic against LOCAL fixtures — zero network, fast on every push/PR.
  # This job is the other half of AC-P0-006: install the ACTUAL pinned npm
  # packages from the registry and patch them for real, so a registry-side
  # change (a repack, a version drift) that no local fixture could see still
  # gates the release. It also proves the smoke ISN'T a no-op by deliberately
  # breaking each patch's anchor context first and asserting that failure mode
  # fires — a smoke nobody runs (or that can't fail) is worse than none.
  patch-smoke:
    name: patch smoke (real npm install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "25.9.0"

      - name: Resolve pinned packages from the Dockerfile
        id: pins
        run: |
          set -euo pipefail
          PI_PACKAGE="$(grep -oP '^ARG PI_PACKAGE=\K\S+' Dockerfile)"
          TODO_PACKAGE="$(grep -oP 'pi-manage-todo-list@\S+' Dockerfile | head -1)"
          test -n "$PI_PACKAGE" && test -n "$TODO_PACKAGE"
          echo "pi_package=$PI_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "todo_package=$TODO_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: npm install (real registry resolution) — pi + pi-manage-todo-list
        env:
          PI_PACKAGE: ${{ steps.pins.outputs.pi_package }}
          TODO_PACKAGE: ${{ steps.pins.outputs.todo_package }}
        run: |
          set -euxo pipefail
          export HOME="$RUNNER_TEMP/patch-smoke-home"
          export NPM_CONFIG_PREFIX="$RUNNER_TEMP/patch-smoke-npm"
          mkdir -p "$HOME" "$HOME/.pi/agent/npm"
          npm install --global --ignore-scripts "$PI_PACKAGE"
          npm install --prefix "$HOME/.pi/agent/npm" --ignore-scripts "$TODO_PACKAGE"
          {
            echo "TUI_JS=$NPM_CONFIG_PREFIX/lib/node_modules/@earendil-works/pi-coding-agent/node_modules/@earendil-works/pi-tui/dist/tui.js"
            echo "TUI_INDEX=$NPM_CONFIG_PREFIX/lib/node_modules/@earendil-works/pi-coding-agent/node_modules/@earendil-works/pi-tui/dist/index.js"
            echo "TODO_DIST=$HOME/.pi/agent/npm/node_modules/pi-manage-todo-list/dist"
          } >> "$GITHUB_ENV"

      - name: Prove BOTH patches FAIL loud on a deliberately broken anchor (before patching)
        run: |
          set -euxo pipefail
          cp "$TUI_JS" "$TUI_JS.orig"
          cp "$TODO_DIST/state-manager.js" "$TODO_DIST/state-manager.js.orig"

          # tui-bottom-pin is non-fatal by design (an image build must still
          # succeed on drift) — it must warn loudly and leave the file untouched.
          sed -i 's/if (firstChanged < prevViewportTop) {/if (firstChanged <= prevViewportTop) { \/\/ deliberately broken for the release smoke/' "$TUI_JS"
          out="$(node scripts/patches/apply-tui-bottom-pin.mjs 2>&1)"
          echo "$out"
          echo "$out" | grep -q 'not found' || { echo "::error::broken tui anchor was NOT detected — patch smoke is not proving anything"; exit 1; }
          diff -q "$TUI_JS" <(sed 's/if (firstChanged < prevViewportTop) {/if (firstChanged <= prevViewportTop) { \/\/ deliberately broken for the release smoke/' "$TUI_JS.orig") \
            || { echo "::error::broken tui file was modified despite the anchor mismatch"; exit 1; }
          cp "$TUI_JS.orig" "$TUI_JS"

          # apply-todo-durable-clear.mjs has no non-fatal fallback — a context
          # mismatch must throw and exit nonzero.
          sed -i 's/if (entry.type !== "message")/if (entry.type !== "message" \&\& entry.type !== "custom") \/\/ deliberately broken for the release smoke/' "$TODO_DIST/state-manager.js"
          if node scripts/patches/apply-todo-durable-clear.mjs 2> /tmp/todo-broken.err; then
            echo "::error::apply-todo-durable-clear.mjs was expected to fail on a broken anchor — it exited 0"; exit 1
          fi
          grep -q 'anchor not found' /tmp/todo-broken.err || { echo "::error::todo patch failed for the wrong reason: $(cat /tmp/todo-broken.err)"; exit 1; }
          cp "$TODO_DIST/state-manager.js.orig" "$TODO_DIST/state-manager.js"

      - name: Apply both patches for real, assert idempotent, run the render harness
        run: |
          set -euxo pipefail
          node scripts/patches/apply-tui-bottom-pin.mjs | tee /tmp/tui-1.log
          grep -q '\[apply-tui-bottom-pin\] patched' /tmp/tui-1.log
          node scripts/patches/apply-tui-bottom-pin.mjs | tee /tmp/tui-2.log
          grep -q 'already patched' /tmp/tui-2.log
          node --check "$TUI_JS"
          PI_TUI_INDEX="$TUI_INDEX" node docs/upstream/tui-bottom-pin/test.mjs
          PI_TUI_INDEX="$TUI_INDEX" node docs/upstream/tui-bottom-pin/edge.mjs
          PI_TUI_INDEX="$TUI_INDEX" node docs/upstream/tui-bottom-pin/integrity.mjs

          node scripts/patches/apply-todo-durable-clear.mjs | tee /tmp/todo-1.log
          grep -q 'patched' /tmp/todo-1.log
          node scripts/patches/apply-todo-durable-clear.mjs | tee /tmp/todo-2.log
          grep -q 'already patched' /tmp/todo-2.log
          node --check "$TODO_DIST/index.js"
          node --check "$TODO_DIST/state-manager.js"

  build:
    name: build ${{ matrix.arch }}
    needs: [version, patch-smoke]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Stamp the version into the tree BEFORE building so the image embeds it.
      # Deterministic (run_number), so both matrix arches stamp the same value.
      - name: Stamp version into the tree
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i -E "s/^VERSION[[:space:]]*\?=.*/VERSION     ?= $V/" Makefile
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$V\"/" package.json
          sed -i -E "s#(image:[[:space:]]*\"docker.io/.*/pix:)[^\"]*\"#\1$V\"#" pi-kit/spec.yaml

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # One Docker Hub PAT authenticates both registries (DHI is gated by your
      # Docker account). dhi.io = pull the base; docker.io = push pix.
      - name: Log in to DHI (pull the hardened base)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub (push)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest + push tags
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push :<version> + :latest
        working-directory: /tmp/digests
        run: |
          V="${{ needs.version.outputs.version }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${V}" -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${V}"

  bump:
    name: commit version bump to main
    needs: [version, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bump version files and commit back
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i -E "s/^VERSION[[:space:]]*\?=.*/VERSION     ?= $V/" Makefile
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$V\"/" package.json
          sed -i -E "s#(image:[[:space:]]*\"docker.io/.*/pix:)[^\"]*\"#\1$V\"#" pi-kit/spec.yaml
          if git diff --quiet; then echo "no version change — nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile package.json pi-kit/spec.yaml
          git commit -m "chore: publish $V [skip ci]"
          git push

      # Tag the stamped commit so the launcher's kit pin resolves. The `pix`
      # launcher pins the kit to its own release via
      # `--kit "git+...#ref=v<version>&dir=pi-kit"`, so every published version
      # needs a matching annotated tag `v<version>` on the commit that carries the
      # stamped spec.yaml. This step runs after the commit-back, so HEAD is that
      # commit (or the current tip when there was nothing to bump). Idempotent: a
      # pre-existing tag is a no-op, not a failed run.
      - name: Tag the release
        run: |
          V="${{ needs.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "tag v$V already exists — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "pix v$V"
          git push origin "v$V"

  # Cross-compile the two HOST binaries (pix launcher + pix-host) for
  # darwin/linux × amd64/arm64 and attach them, plus a SHA256SUMS, to the v<VER>
  # GitHub Release. This is the repo-less install path: `install.sh` fetches these
  # assets so a consumer never clones. Pure Go toolchain — no Docker, no DHI base.
  # Runs after `bump` so the `v<VER>` tag already exists and the release hangs off
  # the commit carrying the stamped spec.yaml (same commit the kit pin resolves to).
  release-binaries:
    name: build + upload release binaries
    needs: [version, bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      # Check out the tag so the tree matches the stamped commit the release points at.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/host/go.mod
          cache-dependency-path: services/host/go.sum

      # -X main.version stamps both package-main binaries: the launcher and
      # pix-host each define the same symbol. Output names match install.sh's
      # existing loose-asset URL pattern.
      - name: Cross-compile both binaries
        working-directory: services/host
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "-X main.version=$V" \
              -o "$GITHUB_WORKSPACE/dist/pix-$os-$arch" ./cmd/pix
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "-X main.version=$V" \
              -o "$GITHUB_WORKSPACE/dist/pix-host-$os-$arch" ./
          done

      - name: Build combined Darwin tarballs for Homebrew
        working-directory: dist
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          for arch in amd64 arm64; do
            stage="$(mktemp -d)"
            cp "pix-darwin-$arch" "$stage/pix"
            cp "pix-host-darwin-$arch" "$stage/pix-host"
            cp "$GITHUB_WORKSPACE/services/host/cmd/pix/pix.1" "$stage/pix.1"
            chmod 0755 "$stage/pix" "$stage/pix-host"
            tar -C "$stage" -czf "pix_${V}_darwin_${arch}.tar.gz" pix pix-host pix.1
            rm -rf "$stage"
          done
          ls -la pix_*.tar.gz

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum pix-* pix_*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Upload assets to the v<version> release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: pix v${{ needs.version.outputs.version }}
          files: |
            dist/pix-*
            dist/pix_*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
