name: publish

# Every push to main auto-publishes a NEW immutable version. CI starts with the
# version committed in package.json (0.1.0 for the first Pix release), then
# increments its patch component until it finds a version that is unused by BOTH
# an unused v<version> git tag AND the image registry (see the `version` job:
# the git tag is created late, by `bump`, so a run that pushed the image and
# then died would otherwise hand the SAME version to the next run, silently
# overwriting a published tag). It builds multi-arch (amd64 + arm64), pushes
# :<version> + :latest, then commits the selected version into all lockstep
# files ([skip ci] prevents recursion).
#
# NOTHING is pushed before the legal AND test gates pass: `legal-gate` calls
# .github/workflows/legal.yml (full-history secret scan, third-party/license
# class gate, repo SBOM) and `test-gate` calls .github/workflows/test.yml
# (fast gate, race, corpus/coverage, macOS) as jobs IN THIS GRAPH, and both
# `build` and `merge` `needs` them. Each used to run only as a separate
# workflow, which GitHub does not order against this one — so a gate could
# still be running, or already red, while a versioned image went out. That is
# not hypothetical for the test half: v0.1.27 published an image, tags, release
# binaries and a Homebrew tap PR while `test` was red on the very same commit.
#
# Why: sbx caches materialized templates PER TAG NAME and won't re-pull a tag it
# already has. A moving tag (:edge/:latest) therefore goes stale until you evict
# it by hand. A brand-new version tag every push sidesteps that entirely. The
# committed spec.yaml always points at the latest successfully published image.
#
# Multi-arch native runners (no QEMU) — the image is chromium-heavy. Each arch is
# pushed by digest, then merged into one multi-arch tag.
#
# Required repo SECRETS (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  — one Docker Hub PAT (Read + Write) on a
#       DHI-entitled account. Authenticates BOTH the dhi.io base PULL and the
#       Docker Hub PUSH (DHI is gated by your Docker account, so one PAT does both).
# Optional repo VARIABLE:
#   DOCKER_USER                           — Docker Hub namespace (default: mcavage)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Serialize runs so version bumps land in order and the commit-back never races.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # the bump job commits the version bump back to main

env:
  IMAGE: docker.io/${{ vars.DOCKER_USER || 'mcavage' }}/pix

jobs:
  # The pre-publish legal gate, as a job in THIS graph (not a workflow racing
  # this one): full-history secret scan, third-party notices + license-class
  # gate, repo-tree SBOM. `build` and `merge` both wait on it.
  legal-gate:
    name: pre-publish legal gate
    uses: ./.github/workflows/legal.yml
    # A called workflow inherits NO secrets by default. The SBOM job needs the
    # Docker Hub login for Scout's entitlement, and without this it fails with
    # "Username and password required" even though the standalone run of the
    # same workflow passes.
    secrets: inherit

  test-gate:
    name: pre-publish test gate
    uses: ./.github/workflows/test.yml

  version:
    name: compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Needed to ASK the registry whether a tag already exists (below).
      - name: Log in to Docker Hub (registry tag probe)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: v
        name: Select the next patch version unused by BOTH the git tags and the registry
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          if ! [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "package.json version is not semver: $base" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version="$base"
          # Two independent sources of "already used", because they are written
          # at DIFFERENT times: `merge` pushes the registry tag, `bump` creates
          # the git tag much later. A run that died in between leaves the git
          # tag free and the registry tag taken; trusting only git here is what
          # lets the next run overwrite a published image.
          # tag-availability.sh fails CLOSED (exit 2) on any undecidable answer
          # — auth, network, unknown error. Its verdict is captured by an
          # ASSIGNMENT, deliberately: inside an `if [ "$(...)" = ... ]` the
          # condition context suppresses `set -e`, so an exit-2 would read as
          # an empty string, i.e. "not taken", i.e. fail OPEN — the exact
          # failure this guard exists to prevent.
          while :; do
            if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              echo "git tag v${version} exists - trying the next patch"
            else
              verdict="$(bash scripts/release/tag-availability.sh "$IMAGE" "$version")"
              if [ "$verdict" = "taken" ]; then
                echo "::warning::${IMAGE}:${version} already exists in the registry with no v${version} git tag:"
                echo "::warning::a previous run published it and then failed before tagging. Selecting the next patch instead of overwriting it."
              elif [ "$verdict" = "free" ]; then
                break
              else
                echo "::error::tag-availability.sh returned an unrecognized verdict '$verdict' for ${IMAGE}:${version}"
                exit 1
              fi
            fi
            patch=$((patch + 1))
            version="${major}.${minor}.${patch}"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Pix $version (base: $base)"

  # Real npm-resolution smoke for the two vendored runtime patches
  # (scripts/patches/*.mjs). tests/pi-patches.test.mjs (the PR gate) proves the
  # patch logic against LOCAL fixtures — zero network, fast on every push/PR.
  # This job is the other half of AC-P0-006: install the ACTUAL pinned npm
  # packages from the registry and patch them for real, so a registry-side
  # change (a repack, a version drift) that no local fixture could see still
  # gates the release. It also proves the smoke ISN'T a no-op by deliberately
  # breaking each patch's anchor context first and asserting that failure mode
  # fires — a smoke nobody runs (or that can't fail) is worse than none.
  patch-smoke:
    name: patch smoke (real npm install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "25.9.0"

      - name: Resolve pinned packages from the Dockerfile
        id: pins
        run: |
          set -euo pipefail
          PI_PACKAGE="$(grep -oP '^ARG PI_PACKAGE=\K\S+' Dockerfile)"
          TODO_PACKAGE="$(grep -oP 'pi-manage-todo-list@\S+' Dockerfile | head -1)"
          test -n "$PI_PACKAGE" && test -n "$TODO_PACKAGE"
          echo "pi_package=$PI_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "todo_package=$TODO_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: npm install (real registry resolution) — pi + pi-manage-todo-list
        env:
          PI_PACKAGE: ${{ steps.pins.outputs.pi_package }}
          TODO_PACKAGE: ${{ steps.pins.outputs.todo_package }}
        run: |
          set -euxo pipefail
          export HOME="$RUNNER_TEMP/patch-smoke-home"
          export NPM_CONFIG_PREFIX="$RUNNER_TEMP/patch-smoke-npm"
          mkdir -p "$HOME" "$HOME/.pi/agent/npm"
          npm install --global --ignore-scripts "$PI_PACKAGE"
          npm install --prefix "$HOME/.pi/agent/npm" --ignore-scripts "$TODO_PACKAGE"
          # DISCOVER the renderer file, never hardcode its name: pi-tui 0.84.0
          # moved the main-screen doRender() out of dist/tui.js into
          # dist/tui-main-screen.js, and a pinned path silently pointed this smoke
          # at a file with no anchor in it — the patch correctly warned, and the
          # "assert patched" step failed the release instead of the drift being
          # visible. Prefer the new name, fall back to the old one, and FAIL LOUD
          # if neither exists rather than exporting an empty path.
          tui_dist="$NPM_CONFIG_PREFIX/lib/node_modules/@earendil-works/pi-coding-agent/node_modules/@earendil-works/pi-tui/dist"
          tui_js=""
          for candidate in tui-main-screen.js tui.js; do
            if [ -f "$tui_dist/$candidate" ]; then tui_js="$tui_dist/$candidate"; break; fi
          done
          if [ -z "$tui_js" ]; then
            echo "::error::no pi-tui renderer found in $tui_dist (looked for tui-main-screen.js, tui.js)"; exit 1
          fi
          echo "patch smoke will target renderer: $tui_js"
          {
            echo "TUI_JS=$tui_js"
            echo "TUI_INDEX=$tui_dist/index.js"
            echo "TODO_DIST=$HOME/.pi/agent/npm/node_modules/pi-manage-todo-list/dist"
          } >> "$GITHUB_ENV"

      - name: Prove BOTH patches FAIL loud on a deliberately broken anchor (before patching)
        run: |
          set -euxo pipefail
          cp "$TUI_JS" "$TUI_JS.orig"
          cp "$TODO_DIST/state-manager.js" "$TODO_DIST/state-manager.js.orig"

          # tui-bottom-pin is non-fatal by design (an image build must still
          # succeed on drift) — it must warn loudly and leave the file untouched.
          sed -i 's/if (firstChanged < prevViewportTop) {/if (firstChanged <= prevViewportTop) { \/\/ deliberately broken for the release smoke/' "$TUI_JS"
          out="$(node scripts/patches/apply-tui-bottom-pin.mjs 2>&1)"
          echo "$out"
          echo "$out" | grep -q 'not found' || { echo "::error::broken tui anchor was NOT detected — patch smoke is not proving anything"; exit 1; }
          diff -q "$TUI_JS" <(sed 's/if (firstChanged < prevViewportTop) {/if (firstChanged <= prevViewportTop) { \/\/ deliberately broken for the release smoke/' "$TUI_JS.orig") \
            || { echo "::error::broken tui file was modified despite the anchor mismatch"; exit 1; }
          cp "$TUI_JS.orig" "$TUI_JS"

          # apply-todo-durable-clear.mjs has no non-fatal fallback — a context
          # mismatch must throw and exit nonzero.
          sed -i 's/if (entry.type !== "message")/if (entry.type !== "message" \&\& entry.type !== "custom") \/\/ deliberately broken for the release smoke/' "$TODO_DIST/state-manager.js"
          if node scripts/patches/apply-todo-durable-clear.mjs 2> /tmp/todo-broken.err; then
            echo "::error::apply-todo-durable-clear.mjs was expected to fail on a broken anchor — it exited 0"; exit 1
          fi
          grep -q 'anchor not found' /tmp/todo-broken.err || { echo "::error::todo patch failed for the wrong reason: $(cat /tmp/todo-broken.err)"; exit 1; }
          cp "$TODO_DIST/state-manager.js.orig" "$TODO_DIST/state-manager.js"

      - name: Apply both patches for real, assert idempotent, run the render harness
        run: |
          set -euxo pipefail
          node scripts/patches/apply-tui-bottom-pin.mjs | tee /tmp/tui-1.log
          grep -q '\[apply-tui-bottom-pin\] patched' /tmp/tui-1.log
          node scripts/patches/apply-tui-bottom-pin.mjs | tee /tmp/tui-2.log
          grep -q 'already patched' /tmp/tui-2.log
          node --check "$TUI_JS"
          PI_TUI_INDEX="$TUI_INDEX" node docs/upstream/tui-bottom-pin/test.mjs
          PI_TUI_INDEX="$TUI_INDEX" node docs/upstream/tui-bottom-pin/edge.mjs
          PI_TUI_INDEX="$TUI_INDEX" node docs/upstream/tui-bottom-pin/integrity.mjs

          node scripts/patches/apply-todo-durable-clear.mjs | tee /tmp/todo-1.log
          grep -q 'patched' /tmp/todo-1.log
          node scripts/patches/apply-todo-durable-clear.mjs | tee /tmp/todo-2.log
          grep -q 'already patched' /tmp/todo-2.log
          node --check "$TODO_DIST/index.js"
          node --check "$TODO_DIST/state-manager.js"

  build:
    name: build ${{ matrix.arch }}
    # legal-gate AND test-gate FIRST: this job pushes layers by digest, so it
    # must not run before the secret scan / license gate / SBOM have passed,
    # nor before the suite is green. v0.1.27 published a complete release --
    # image, tags, binaries, tap PR -- while `test` was red on the same commit,
    # because the two workflows were independent and nothing ordered them.
    needs: [version, patch-smoke, legal-gate, test-gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Stamp the version into the tree BEFORE building so the image embeds it.
      # Deterministic (run_number), so both matrix arches stamp the same value.
      - name: Stamp version into the tree
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i -E "s/^VERSION[[:space:]]*\?=.*/VERSION     ?= $V/" Makefile
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$V\"/" package.json
          sed -i -E "s#(image:[[:space:]]*\"docker.io/.*/pix:)[^\"]*\"#\1$V\"#" pi-kit/spec.yaml

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # One Docker Hub PAT authenticates both registries (DHI is gated by your
      # Docker account). dhi.io = pull the base; docker.io = push pix.
      - name: Log in to DHI (pull the hardened base)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub (push)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest + push tags
    # The one job that creates the VERSIONED tag. legal-gate and test-gate are
    # named again (not just inherited through `build`) so the ordering is
    # explicit at the step that mutates a public tag.
    needs: [version, build, legal-gate, test-gate]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      # Needed for scripts/release/tag-availability.sh (the pre-mutation check).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Last line of defense before a public tag is mutated. The `version` job
      # already asked the registry, but that was minutes and one full multi-arch
      # build ago, and a concurrent/retried run could have published in between
      # (`concurrency: publish` serializes runs, it does not make an earlier
      # run's push disappear). Ask again, immediately before the create, and
      # FAIL rather than overwrite. Fails closed on an undecidable answer too.
      - name: Refuse to overwrite an existing :<version> tag
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          # ASSIGNMENT, not `if [ "$(...)" ]`: a condition context suppresses
          # `set -e`, which would turn the script's fail-closed exit 2 into an
          # empty string and let the create proceed.
          verdict="$(bash scripts/release/tag-availability.sh "$IMAGE" "$V")"
          if [ "$verdict" != "free" ]; then
            echo "::error::${IMAGE}:${V}: refusing to overwrite a published tag (verdict: $verdict)."
            echo "::error::Nothing was mutated. Re-run publish: the version selector will pick the next unused patch."
            exit 1
          fi
          echo "${IMAGE}:${V} is unused - safe to create the manifest"

      - name: Create and push :<version> + :latest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${V}" -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${V}"
          # AC-REL-04: the multi-arch manifest-list digest is the immutable
          # identity of what was actually published. Capture it here (the one
          # place it exists) and hand it to the provenance job.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${V}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::could not resolve the published manifest digest (got '$digest')"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}:${V} -> $digest"

  # AC-REL-04: provenance + SBOM for the artifact that was actually PUBLISHED,
  # pinned to the manifest digest the `merge` job just resolved (not a local
  # rebuild, which is a different artifact). BLOCKING on purpose: if we cannot
  # record an immutable version->digest provenance record, or cannot produce an
  # SBOM of the published image, the release does not get to claim either.
  provenance:
    name: provenance + SBOM (published digest)
    needs: [version, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to Docker Hub (the SBOM scan pulls the published image)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record immutable provenance (version -> published digest)
        env:
          V: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          bash scripts/release/verify-provenance.sh "$V" "$DIGEST" "$GITHUB_SHA"
          cat "out/provenance/$V.json"

      # Docker Scout, not Anchore: see legal.yml. The syft download 503'd here and
      # killed a release whose every other gate was green.
      - name: SBOM of the PUBLISHED image (by digest, SPDX)
        uses: docker/scout-action@5dae9c7571dd0f3de81f5b501240c593c13c3eb6 # v1.9.3
        with:
          command: sbom
          image: ${{ env.IMAGE }}@${{ needs.merge.outputs.digest }}
          format: spdx
          output: sbom.spdx.json

      # The SBOM must not describe some OTHER image. Scout records what it
      # analyzed as a pkg:oci purl, and for a multi-arch reference that is the
      # PLATFORM CHILD it resolved, not the index digest passed in. So when a
      # purl is present the check is that its digest is the published index or
      # one of its children, read from `imagetools inspect --raw`.
      #
      # The purl is not always there. Scout emits it when it can read the
      # image's provenance attestation; scanning a digest seconds after the push
      # that created it, CI got an SBOM with 652 packages and no purl, while the
      # same digest scanned later from a laptop had one. So a missing purl is not
      # treated as a failure.
      #
      # What that leaves, stated rather than implied: with no purl, the binding
      # between this SBOM and the published digest rests on the workflow having
      # passed `IMAGE@DIGEST` to Scout, which is by construction and not
      # independently verified here. A purl that names the WRONG image still
      # fails the release, which is the case worth catching.
      - name: Assert the SBOM is real and describes the published artifact
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          test -s sbom.spdx.json
          jq -e '.packages | length > 0' sbom.spdx.json >/dev/null

          sbom_digest="$(jq -r '
            [ .packages[]?.externalRefs[]?.referenceLocator
              | select(startswith("pkg:oci/")) ]
            | first // ""' sbom.spdx.json | sed -n 's/.*@\(sha256:[0-9a-f]*\).*/\1/p')"

          if [ -z "$sbom_digest" ]; then
            echo "::notice::SBOM records no pkg:oci purl (no provenance attestation readable yet)."
            echo "::notice::It is bound to $DIGEST by the reference this workflow passed to Scout."
            exit 0
          fi

          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            | jq -r --arg d "$DIGEST" '$d, (.manifests[]?.digest // empty)' > /tmp/published-digests

          grep -qx "$sbom_digest" /tmp/published-digests || {
            echo "::error::SBOM describes $sbom_digest, which is not $DIGEST nor any of its platform children"
            cat /tmp/published-digests
            exit 1
          }
          echo "SBOM describes $sbom_digest, a published manifest under $DIGEST"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance-and-sbom-${{ needs.version.outputs.version }}
          path: |
            out/provenance/
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

  bump:
    name: commit version bump to main
    needs: [version, merge, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bump version files and commit back
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i -E "s/^VERSION[[:space:]]*\?=.*/VERSION     ?= $V/" Makefile
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$V\"/" package.json
          sed -i -E "s#(image:[[:space:]]*\"docker.io/.*/pix:)[^\"]*\"#\1$V\"#" pi-kit/spec.yaml
          if git diff --quiet; then echo "no version change — nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile package.json pi-kit/spec.yaml
          git commit -m "chore: publish $V [skip ci]"
          # A plain `git push` here races any merge that lands while this run was
          # building. `concurrency: group: publish` serializes publish RUNS but
          # cannot stop a human merging a PR into main mid-run -- which is
          # exactly what rejected this push on 2026-08-08 ("! [rejected] main ->
          # main (fetch first)") when two PRs were merged a few minutes apart.
          # The cost was a half-published version: the image and its registry tag
          # went out, then bump died and took release-binaries and bump-tap with
          # it, so 0.1.31 had no git tag, no GitHub release, no binaries and no
          # Homebrew bump.
          #
          # Rebase and retry. This commit touches ONLY the three version files,
          # which nothing else in the repo writes, so replaying it onto a moved
          # main is safe. A genuine conflict is reported and fails the job rather
          # than looping or being force-pushed over.
          pushed=""
          for attempt in 1 2 3; do
            if git push; then pushed=yes; break; fi
            echo "push rejected (main moved under this run); rebasing and retrying ($attempt/3)"
            if ! git pull --rebase origin main; then
              echo "::error::version bump could not rebase onto main: conflict in Makefile, package.json or pi-kit/spec.yaml"
              exit 1
            fi
          done
          if [ -z "$pushed" ]; then
            echo "::error::version bump could not be pushed after 3 attempts; main is moving faster than this job can rebase"
            exit 1
          fi

      # Tag the stamped commit so the launcher's kit pin resolves. The `pix`
      # launcher pins the kit to its own release via
      # `--kit "git+...#ref=v<version>&dir=pi-kit"`, so every published version
      # needs a matching annotated tag `v<version>` on the commit that carries the
      # stamped spec.yaml. This step runs after the commit-back, so HEAD is that
      # commit (or the current tip when there was nothing to bump). Idempotent: a
      # pre-existing tag is a no-op, not a failed run.
      - name: Tag the release
        run: |
          V="${{ needs.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "tag v$V already exists — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "pix v$V"
          git push origin "v$V"

  # Cross-compile the two HOST binaries (pix launcher + pix-host) for
  # darwin × amd64/arm64, bundle each pair into a NOTICE-BEARING tarball, and
  # attach the tarballs plus a SHA256SUMS to the v<VER> GitHub Release. This is
  # the repo-less install path: Homebrew and `install.sh` both fetch the SAME
  # tarball. Pure Go toolchain — no Docker, no DHI base.
  #
  # AC-REL-02: the LOOSE `pix-darwin-<arch>` / `pix-host-darwin-<arch>` assets
  # are deliberately NOT published any more. They were a bare distribution of
  # pix (MIT s2) and of the MPL-2.0 code linked into pix-host (MPL-2.0 s3.1)
  # with none of the required notices attached, and install.sh consumed exactly
  # those. install.sh now consumes the tarball, so there is no remaining
  # consumer for a notice-less asset — and the release must not offer one.
  # Runs after `bump` so the `v<VER>` tag already exists and the release hangs off
  # the commit carrying the stamped spec.yaml (same commit the kit pin resolves to).
  release-binaries:
    name: build + upload release binaries
    needs: [version, bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      # Check out the tag so the tree matches the stamped commit the release points at.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/host/go.mod
          cache-dependency-path: services/host/go.sum

      # -X main.version stamps both package-main binaries: the launcher and
      # pix-host each define the same symbol. These are BUILD INTERMEDIATES:
      # they are staged into the notice-bearing tarballs below and are not
      # published as release assets. darwin ONLY: pix's host lifecycle
      # (launchd-managed serve, the pix/pix-host binaries themselves) is
      # macOS-only, so there is no consumer for a linux pix/pix-host release
      # asset any more. This is unrelated to the pix SANDBOX image (built by
      # the `build`/`patch-smoke` jobs above), which stays linux/amd64 +
      # linux/arm64 — that is a container, not a host binary.
      - name: Cross-compile both binaries
        working-directory: services/host
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for target in darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "-X main.version=$V" \
              -o "$GITHUB_WORKSPACE/dist/pix-$os-$arch" ./cmd/pix
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "-X main.version=$V" \
              -o "$GITHUB_WORKSPACE/dist/pix-host-$os-$arch" ./
          done

      - name: Build combined Darwin tarballs for Homebrew
        working-directory: dist
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          for arch in amd64 arm64; do
            stage="$(mktemp -d)"
            cp "pix-darwin-$arch" "$stage/pix"
            cp "pix-host-darwin-$arch" "$stage/pix-host"
            # AC-REL-01/02: the Homebrew tarball is a real distribution artifact
            # of the third-party components baked into these binaries (incl.
            # the MPL-2.0 go-plugin/yamux notice) — ship the notices alongside it.
            # (The man page, pix.1, was retired along with `pix man`/`--man`;
            # `pix help --all` is the one verb map now, so nothing bundles it.)
            cp "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" "$stage/THIRD_PARTY_NOTICES.md"
            cp "$GITHUB_WORKSPACE/NOTICE.md" "$stage/NOTICE.md"
            # pix's own MIT terms (MIT s2) and the verbatim MPL-2.0 text for the
            # go-plugin/yamux code linked into these binaries (MPL-2.0 s3.1/3.2)
            # ship WITH the binaries, not just in the repo.
            cp "$GITHUB_WORKSPACE/LICENSE" "$stage/LICENSE"
            mkdir -p "$stage/licenses"
            cp "$GITHUB_WORKSPACE/licenses/MPL-2.0.txt" "$stage/licenses/MPL-2.0.txt"
            chmod 0755 "$stage/pix" "$stage/pix-host"
            tar -C "$stage" -czf "pix_${V}_darwin_${arch}.tar.gz" pix pix-host THIRD_PARTY_NOTICES.md NOTICE.md LICENSE licenses
            rm -rf "$stage"
          done
          ls -la pix_*.tar.gz

      # Gate the assets themselves: every published tarball must carry the
      # notices, or it is not a lawful distribution of what is inside it. This
      # asserts the bytes that are about to be uploaded, not the workflow text
      # that produced them.
      - name: Assert every published tarball carries the notices
        working-directory: dist
        run: |
          set -euo pipefail
          for t in pix_*.tar.gz; do
            listing="$(tar -tzf "$t")"
            for required in pix pix-host THIRD_PARTY_NOTICES.md NOTICE.md LICENSE licenses/MPL-2.0.txt; do
              printf '%s\n' "$listing" | grep -qx "$required" \
                || { echo "::error::$t is missing $required"; exit 1; }
            done
            echo "$t: notices present"
          done

      # Only the tarballs are hashed, because only the tarballs ship.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum pix_*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Upload assets to the v<version> release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: pix v${{ needs.version.outputs.version }}
          # NOTE: no `dist/pix-*` line. See the AC-REL-02 note on this job:
          # publishing the bare binaries shipped pix and the MPL-2.0 code inside
          # pix-host with no notices attached.
          files: |
            dist/pix_*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  bump-tap:
    name: open Homebrew tap bump PR
    needs: [version, release-binaries]
    runs-on: ubuntu-latest
    steps:
      # FIRST, before anything writes into the workspace: actions/checkout
      # cleans the path it checks out, so a root checkout after the curl below
      # would delete the SHA256SUMS this job just downloaded. This checkout is
      # what makes packaging/homebrew/pix.rb available to copy over the tap's.
      - name: Check out pix (for the vendored formula)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download this release's checksum manifest
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o SHA256SUMS \
            "https://github.com/mcavage/pix/releases/download/v${V}/SHA256SUMS"

      - name: Read archive hashes from SHA256SUMS
        id: sha
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          arm="$(awk -v f="pix_${V}_darwin_arm64.tar.gz" '$2 == f {print $1}' SHA256SUMS)"
          amd="$(awk -v f="pix_${V}_darwin_amd64.tar.gz" '$2 == f {print $1}' SHA256SUMS)"
          test -n "$arm" && test -n "$amd"
          echo "arm64=$arm" >> "$GITHUB_OUTPUT"
          echo "amd64=$amd" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: mcavage/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap

      # packaging/homebrew/pix.rb is the SOURCE OF TRUTH for the formula, not
      # the tap's copy. Copying it out on every release is what makes the
      # `def install` block reviewable in the same PR that changes what the
      # tarball contains -- the drift that shipped a broken v0.1.27, where the
      # tarball dropped pix.1 and the tap's formula kept installing it.
      # tests/homebrew-formula.test.mjs asserts this copy exists AND that the
      # formula only installs paths the tarball actually stages.
      - name: Copy the vendored formula over the tap's
        run: cp "$GITHUB_WORKSPACE/packaging/homebrew/pix.rb" tap/Formula/pix.rb

      - name: Update formula version, release URLs, and hashes
        env:
          V: ${{ needs.version.outputs.version }}
          ARM_SHA: ${{ steps.sha.outputs.arm64 }}
          AMD_SHA: ${{ steps.sha.outputs.amd64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("tap/Formula/pix.rb")
          body = path.read_text()
          version = os.environ["V"]
          body, count = re.subn(
              r'(^\s*version ")[^"]+("\s*$)',
              rf'\g<1>{version}\g<2>',
              body,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"expected one explicit version, replaced {count}")
          replacements = (
              ("arm", os.environ["ARM_SHA"]),
              ("intel", os.environ["AMD_SHA"]),
          )
          for block, digest in replacements:
              pattern = rf'(on_{block} do\n\s+url ")[^"]+("\n\s+sha256 ")[^"]+("\n\s+end)'
              asset_arch = "arm64" if block == "arm" else "amd64"
              url = f"https://github.com/mcavage/pix/releases/download/v{version}/pix_{version}_darwin_{asset_arch}.tar.gz"
              body, count = re.subn(pattern, rf'\g<1>{url}\g<2>{digest}\g<3>', body)
              if count != 1:
                  raise SystemExit(f"expected one on_{block} block, replaced {count}")
          path.write_text(body)
          PY

      - name: Assert formula hashes came from SHA256SUMS
        run: |
          set -euo pipefail
          grep -q 'version "${{ needs.version.outputs.version }}"' tap/Formula/pix.rb
          grep -q '${{ steps.sha.outputs.arm64 }}' tap/Formula/pix.rb
          grep -q '${{ steps.sha.outputs.amd64 }}' tap/Formula/pix.rb

      - name: Push bump branch and open PR
        id: tap_pr
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="bump-v${V}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/pix.rb
          git commit -m "pix v${V}"
          git push origin "$branch"
          pr_url="$(gh pr create --repo mcavage/homebrew-tap \
            --title "pix v${V}" \
            --body "Automated bump from mcavage/pix release v${V}." \
            --base main --head "$branch")"
          gh pr merge "$pr_url" --repo mcavage/homebrew-tap --auto --squash
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # Auto-merge means a RED tap PR does not merge -- it just sits there,
      # silently, and Homebrew users keep getting the previous version with no
      # signal anywhere that the release only half-landed. v0.1.27 sat broken
      # for ~14 hours exactly this way: `publish` was green end to end while
      # `brew install` was failing with ENOENT.
      #
      # So: wait for the tap's checks and fail THIS run if they go red. Nothing
      # is rolled back (the image and tags are long since public by now) -- the
      # point is that the release run's own status tells the truth about
      # whether the artifact users install actually installs.
      - name: Wait for the tap PR's checks, and fail loudly if they go red
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          PR_URL: ${{ steps.tap_pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do   # 40 x 30s = 20 min ceiling
            # `gh pr checks` exits 0 when all checks succeeded, 8 while any are
            # still pending, and 1 on failure. It ALSO exits 1 with "no checks
            # reported" in the window between opening the PR and the tap's
            # workflow registering, so that case is matched explicitly and
            # treated as pending -- otherwise this races PR creation and fails
            # every release. Anything else that is not a clean 0 is a failure:
            # "no signal" must never read as "passed".
            set +e
            out="$(gh pr checks "$PR_URL" --repo mcavage/homebrew-tap 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "$out"; echo "tap PR checks are green"; exit 0
            fi
            if [ "$rc" -eq 8 ] || printf '%s' "$out" | grep -qi "no checks reported"; then
              sleep 30; continue
            fi
            echo "$out"
            echo "::error::tap PR $PR_URL has failing checks -- brew install is broken for v${{ needs.version.outputs.version }}"
            exit 1
          done
          echo "::error::tap PR $PR_URL checks did not conclude within 20 minutes: $PR_URL"
          exit 1
