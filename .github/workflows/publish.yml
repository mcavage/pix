name: publish

# Every push to main auto-publishes a NEW immutable version. CI stamps
# 0.0.<run_number> into the tree, builds multi-arch (amd64 + arm64), pushes
# :<version> + :latest, then commits the bumped version files back to main
# ([skip ci] so the bump doesn't retrigger this workflow).
#
# Why: sbx caches materialized templates PER TAG NAME and won't re-pull a tag it
# already has. A moving tag (:edge/:latest) therefore goes stale until you evict
# it by hand. A brand-new version tag every push sidesteps that entirely — sbx
# has never seen :0.0.N, so `sbx run pi-stack --kit git+...` (which reads the
# pinned image out of pi-kit/spec.yaml on main) always pulls a fresh image with
# NO --template flag and NO `sbx template rm`. spec.yaml on main always points at
# the latest published version because the bump job commits it back.
#
# Multi-arch native runners (no QEMU) — the image is chromium-heavy. Each arch is
# pushed by digest, then merged into one multi-arch tag.
#
# Required repo SECRETS (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  — one Docker Hub PAT (Read + Write) on a
#       DHI-entitled account. Authenticates BOTH the dhi.io base PULL and the
#       Docker Hub PUSH (DHI is gated by your Docker account, so one PAT does both).
# Optional repo VARIABLE:
#   DOCKER_USER                           — Docker Hub namespace (default: mcavage)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Serialize runs so version bumps land in order and the commit-back never races.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # the bump job commits the version bump back to main

env:
  IMAGE: docker.io/${{ vars.DOCKER_USER || 'mcavage' }}/pi-stack

jobs:
  version:
    name: compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # run_number is monotonic per workflow and never resets → a clean, unique,
      # always-increasing patch number with no state to track.
      - id: v
        run: echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      # Stamp the version into the tree BEFORE building so the image embeds it.
      # Deterministic (run_number), so both matrix arches stamp the same value.
      - name: Stamp version into the tree
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i -E "s/^VERSION[[:space:]]*\?=.*/VERSION     ?= $V/" Makefile
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$V\"/" package.json
          sed -i -E "s#(image:[[:space:]]*\"docker.io/.*/pi-stack:)[^\"]*\"#\1$V\"#" pi-kit/spec.yaml

      - uses: docker/setup-buildx-action@v3

      # One Docker Hub PAT authenticates both registries (DHI is gated by your
      # Docker account). dhi.io = pull the base; docker.io = push pi-stack.
      - name: Log in to DHI (pull the hardened base)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub (push)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest + push tags
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push :<version> + :latest
        working-directory: /tmp/digests
        run: |
          V="${{ needs.version.outputs.version }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${V}" -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${V}"

  bump:
    name: commit version bump to main
    needs: [version, merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version files and commit back
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i -E "s/^VERSION[[:space:]]*\?=.*/VERSION     ?= $V/" Makefile
          sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$V\"/" package.json
          sed -i -E "s#(image:[[:space:]]*\"docker.io/.*/pi-stack:)[^\"]*\"#\1$V\"#" pi-kit/spec.yaml
          if git diff --quiet; then echo "no version change — nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile package.json pi-kit/spec.yaml
          git commit -m "chore: publish $V [skip ci]"
          git push

      # Tag the stamped commit so the launcher's kit pin resolves. The `pi-stack`
      # launcher pins the kit to its own release via
      # `--kit "git+...#ref=v<version>&dir=pi-kit"`, so every published version
      # needs a matching annotated tag `v<version>` on the commit that carries the
      # stamped spec.yaml. This step runs after the commit-back, so HEAD is that
      # commit (or the current tip when there was nothing to bump). Idempotent: a
      # pre-existing tag is a no-op, not a failed run.
      - name: Tag the release
        run: |
          V="${{ needs.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "tag v$V already exists — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "pi-stack v$V"
          git push origin "v$V"

  # Cross-compile the two HOST binaries (pi-stack launcher + pi-stack-host) for
  # darwin/linux × amd64/arm64 and attach them, plus a SHA256SUMS, to the v<VER>
  # GitHub Release. This is the repo-less install path: `install.sh` fetches these
  # assets so a consumer never clones. Pure Go toolchain — no Docker, no DHI base.
  # Runs after `bump` so the `v<VER>` tag already exists and the release hangs off
  # the commit carrying the stamped spec.yaml (same commit the kit pin resolves to).
  release-binaries:
    name: build + upload release binaries
    needs: [version, bump]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      # Check out the tag so the tree matches the stamped commit the release points at.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/host/go.mod
          cache-dependency-path: services/host/go.sum

      # -X main.version stamps the launcher (its `var version`); the host binary has
      # no such symbol, so the linker silently ignores the flag there — harmless, and
      # keeps one build recipe for both. Output names match install.sh's URL pattern:
      # pi-stack-<os>-<arch> and pi-stack-host-<os>-<arch>.
      - name: Cross-compile both binaries
        working-directory: services/host
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "-X main.version=$V" \
              -o "$GITHUB_WORKSPACE/dist/pi-stack-$os-$arch" ./cmd/pi-stack
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -ldflags "-X main.version=$V" \
              -o "$GITHUB_WORKSPACE/dist/pi-stack-host-$os-$arch" ./
          done

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum pi-stack-* > SHA256SUMS && cat SHA256SUMS

      - name: Upload assets to the v<version> release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: pi-stack v${{ needs.version.outputs.version }}
          files: |
            dist/pi-stack-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
