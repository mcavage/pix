# golden: the scaffolded `home` environment (`pix env add home` with no
# path) — runnable and equivalent to the built-in default, not an empty
# stub (docs/design/environments.md §8.1).
schemaVersion: "1"
agent: pix
name: pix-home-11111111
template: docker.io/mcavage/pix:v0.0.0
pullPolicy: missing
workspaces:
  - path: /home/user/.local/share/pix/envs/home
    readOnly: false
    clone: false
  - path: /home/user/.local/share/pix/context
    readOnly: false
    clone: false
kits:
  - /tmp/pix-mixin-11111111
env: {}
